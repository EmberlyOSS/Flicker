[package]
name = "flicker"
version = "0.3.0"
description = "Flicker - Screenshot & Upload Tool for Emberly"
authors = ["CodeMeAPixel"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flicker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Feature flags for cross-platform support
[features]
default = ["desktop"]
desktop = ["screenshots"]        # Enable native screenshot support (Windows, macOS, Linux)
mobile = []                      # Mobile build (minimal features)
android = ["mobile"]             # Android-specific build
ios = ["mobile"]                 # iOS-specific build
windows = ["desktop"]            # Windows-specific build
macos = ["desktop"]              # macOS-specific build
linux = ["desktop"]              # Linux-specific build

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.7"
tauri-plugin-global-shortcut = "2.3"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-notification = "2.3"
tauri-plugin-fs = "2.5"
tauri-plugin-updater = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json", "multipart", "stream"] }
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
chrono = "0.4"
screenshots = { version = "0.8", optional = true }  # Desktop screenshot support
image = "0.24"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
num_cpus = "1.16"
once_cell = "1.19"  # Lazy static initialization

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["sysinfoapi"] }
libloading = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
